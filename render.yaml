# Render Blueprint: one web service serves the API and the built React app.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: smartcart-discount-engine
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GROQ_API_KEY
        sync: false   # paste your key in the Render dashboard (optional)
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MONGODB_URI
        sync: false   # optional: MongoDB Atlas connection string; empty = in-memory only
